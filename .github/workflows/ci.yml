name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  stack:
    name: Build, run and test the stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Production compose file only: tests the image as built, without the dev bind mount.
      COMPOSE: docker compose -f docker-compose.yml
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: $COMPOSE build

      - name: make up (db, migrate, web, worker)
        run: make up

      - name: make migrate is idempotent
        run: |
          make migrate 2>&1 | tee migrate.log
          grep -q "procrastinate schema: already present" migrate.log

      - name: Smoke test (acceptance criteria)
        run: scripts/smoke.sh

      - name: make lint
        run: make lint

      - name: make test
        run: make test

      - name: Stack logs
        if: always()
        run: $COMPOSE logs --no-color

      - name: Stop stack
        if: always()
        run: $COMPOSE down -v
