name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  stack:
    name: Build, run and test the stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Production compose file only: tests the image as built, without the dev bind mount.
      COMPOSE: docker compose -f docker-compose.yml
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: $COMPOSE build

      - name: make up (db, migrate, web, worker)
        run: make up

      - name: make migrate is idempotent
        run: |
          make migrate 2>&1 | tee migrate.log
          grep -q "procrastinate schema: already present" migrate.log

      - name: Smoke test (acceptance criteria)
        run: scripts/smoke.sh

      - name: make lint
        run: make lint

      - name: make test
        run: make test

      - name: Stack logs
        if: always()
        run: $COMPOSE logs --no-color

      - name: Stop stack
        if: always()
        run: $COMPOSE down -v

  install:
    name: install.sh (fresh install, then update)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Fresh install
        run: ./install.sh --yes --password ci-install-pass

      - name: Installed stack answers and asks for the password
        run: |
          set -eu
          grep -q '^COMPOSE_FILE=docker-compose.yml$' .env
          curl -fsS http://localhost:8000/healthz | grep -q '"database":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/)" = 303
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/jobs)" = 401
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: http://localhost:8000' \
            -d password=ci-install-pass http://localhost:8000/login)
          test "$code" = 303
          docker compose ps --status running --services | sort | tr '\n' ' ' | grep -q 'db web worker'

      - name: Second run updates in place (backup first, .env kept)
        run: |
          set -eu
          cp .env env.before
          ./install.sh --yes 2>&1 | tee install2.log
          grep -q 'Keeping the existing .env' install2.log
          grep -q 'Backing up the database' install2.log
          cmp .env env.before
          docker compose exec -T web sh -c 'ls "$DATA_DIR"/backups/db-*.dump'
          curl -fsS http://localhost:8000/healthz

      - name: Stack logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v

  e2e:
    name: End-to-end acceptance (make e2e, twice)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker compose -f docker-compose.yml build

      # scripts/e2e.py starts its own Compose projects with fresh volumes and removes them,
      # so the second run starts from a clean state again.
      - name: make e2e (first run)
        run: make e2e

      - name: make e2e (second run)
        run: make e2e
