# Development overrides, applied automatically by docker compose.
services:
  web:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "app"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - .:/app

  worker:
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - .:/app
