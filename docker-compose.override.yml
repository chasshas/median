# Development overrides, applied automatically by docker compose.
services:
  web:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "app"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - .:/app
      # Optional: put an existing collection in ./imports, then
      # docker compose exec web python -m app.cli import /imports --recursive
      - ${IMPORTS_DIR:-./imports}:/imports:ro

  worker:
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - .:/app
