[project]
name = "median"
version = "0.1.0"
description = "Single-user, self-hosted media crawling and archiving service"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.3",
    "imagehash>=4.3.2",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "procrastinate>=3.10.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# Dev scripts run ffmpeg with fixed argument lists and draw random (non-secret) test media.
"scripts/**" = ["S311", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:cacheprovider"
markers = [
    "network: needs real network access (skipped by default; run with -m network)",
    "slow: slow tests (deselect with -m \"not slow\")",
]
